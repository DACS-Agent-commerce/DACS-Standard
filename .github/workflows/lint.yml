name: Lint

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - next

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Ruff
        run: python3 -m pip install -r requirements-lint.txt

      - name: Lint
        run: ruff check .
