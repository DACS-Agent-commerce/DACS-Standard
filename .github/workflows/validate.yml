name: Validate documentation and conformance vectors

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - next

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install validation dependencies
        run: python3 -m pip install 'cryptography==46.0.5' 'idna==3.10'

      - name: crypto import gate (fail-closed)
        run: python3 -c "import cryptography, idna; print(cryptography.__version__, idna.__version__)"

      - name: Validate conformance vectors
        run: python3 scripts/validate_conformance_vectors.py

      - name: Run minimum-conformant lifecycle walkthrough
        run: python3 scripts/run_lifecycle_walkthrough.py --check

      - name: Validate implementation manifests
        run: python3 scripts/validate_implementation_manifests.py

      - name: Validate security vector sets (candidate tier)
        run: python3 scripts/validate_security_vectors.py

      - name: Verify canonical JSON vectors are deterministic
        run: python3 scripts/generate_canonical_json_vectors.py --check

      - name: Verify payload-attestation vectors are deterministic
        run: python3 scripts/generate_payload_attestation_vectors.py --check

      - name: Verify AP2 handler-safety vectors are deterministic
        run: python3 scripts/generate_ap2_handler_safety_vectors.py --check
      - name: Verify rail-availability vectors are deterministic
        run: python3 scripts/generate_rail_availability_selection_vectors.py --check

      - name: Verify domain-claim GCR vectors are deterministic
        run: python3 scripts/generate_domain_gcr_vectors.py --check

      - name: Verify presence-only claim vectors are deterministic
        run: python3 scripts/generate_presence_only_claim_vectors.py --check

      - name: HTLC-9 ST-8 pack is deterministic and verifies
        run: python3 scripts/generate_htlc9_st8_pack.py --check && python3 scripts/verify_htlc9_st8_pack.py

      - name: Verify alternative-payment vectors are deterministic
        run: python3 scripts/generate_alternative_payment_projection_vectors.py --check

      - name: Verify settlement-finality vectors are deterministic
        run: python3 scripts/generate_settlement_finality_verification_vectors.py --check

      - name: Verify security vector index is in sync
        run: python3 scripts/generate_security_vector_index.py --check

      - name: Validate domain separators
        run: python3 scripts/validate_domain_separators.py

      - name: Validate rule IDs
        run: python3 scripts/validate_rule_ids.py

      - name: Validate rule-ID index pointers
        run: python3 scripts/validate_rule_id_index.py

      - name: Validate conformance § references
        run: python3 scripts/validate_spec_refs.py

      - name: Validate conformance artifact shapes
        run: python3 scripts/validate_artifact_shapes.py

      - name: Verify reference-bearing fixtures are deterministic
        run: python3 scripts/generate_artifact_reference_fixtures.py --check

      - name: Verify signed SEB authority vectors are deterministic
        run: python3 scripts/generate_bundle_settlement_evidence_vectors.py --check

      - name: Verify signed EBFAB compatibility fixture is deterministic
        run: python3 scripts/generate_evidence_bound_fault_bundle_fixture.py --check

      - name: Verify lifecycle vectors are deterministic and in sync
        run: python3 scripts/generate_lifecycle_vectors.py --check

      - name: Validate selected spec tables
        run: python3 scripts/validate_spec_tables.py

      - name: Validate documentation links
        run: python3 scripts/validate-docs.py

      - name: Run unit tests (fail-closed on any skip)
        run: |
          python3 - <<'PY'
          import sys, unittest
          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.TestLoader().discover("tests"))
          if result.skipped:
              print("::error::%d test(s) skipped — every crypto-gated suite MUST run "
                    "(a skipped signature suite means the crypto dependency regressed)"
                    % len(result.skipped))
              for test, reason in result.skipped:
                  print("::error::SKIPPED %s: %s" % (test, reason))
          ok = result.wasSuccessful() and not result.skipped
          sys.exit(0 if ok else 1)
          PY
