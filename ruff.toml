# Bug-finding rules only. Style is left out on purpose: reformatting would
# touch most files and clash with open PRs.
# Run it: python3 -m pip install -r requirements-lint.txt && ruff check .
#
# F: mistakes such as undefined or unused names. E9: syntax errors.
# B023: a function in a loop that reads the loop's variable later.
[lint]
select = ["F", "E9", "B023"]

# Issues already in the code when the linter was added. Remove a line once its
# issues are fixed. Don't add lines to get a pass: fix the new issue, or use a
# `# noqa: <rule>` comment that says why it's safe.
[lint.per-file-ignores]
